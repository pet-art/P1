<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>مساعدي</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#111827;color:#f3f4f6;height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1f2937;padding-top:max(12px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0}
header button{background:none;border:0;color:#9ca3af;font-size:14px;margin-inline-start:12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.u{align-self:flex-start;background:#2563eb}
.a{align-self:flex-end;background:#374151}
.a.t{opacity:.6}
form{display:flex;gap:8px;padding:10px 12px;background:#1f2937;padding-bottom:max(10px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;border:0;border-radius:14px;padding:12px;background:#374151;color:#fff;font:inherit;max-height:120px}
form button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;background:#2563eb;color:#fff}
#mic.on{background:#dc2626}
#panel{position:fixed;inset:0;background:#111827;overflow:auto;padding:16px;display:none}
#panel.show{display:block}
#panel h2{font-size:16px;margin:18px 0 6px;color:#93c5fd}
.card{background:#1f2937;border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.6;white-space:pre-wrap}
#login{position:fixed;inset:0;background:#111827;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:24px}
#login input{width:100%;max-width:320px;padding:12px;border-radius:12px;border:0;background:#374151;color:#fff;font:inherit}
#login button{padding:12px 28px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit}
.copy{float:left;font-size:12px;background:#374151;border:0;color:#fff;border-radius:8px;padding:4px 8px}
</style>
</head>
<body>
<header>
  <h1>مساعدي</h1>
  <div><button id="speak">🔈 صوت: إيقاف</button><button id="data">📋 بياناتي</button><button id="reset">محادثة جديدة</button></div>
</header>
<div id="log"></div>
<form id="f">
  <button type="button" id="mic" title="تحدّث">🎤</button>
  <textarea id="t" rows="1" placeholder="اكتب أو تحدّث…"></textarea>
  <button type="submit">➤</button>
</form>
<div id="panel"><button id="close" style="background:#374151;color:#fff;border:0;border-radius:8px;padding:8px 14px">إغلاق</button><div id="pc"></div></div>
<div id="login"><div style="font-size:42px">🤖</div><input id="pw" type="password" placeholder="كلمة السر"><button id="go">دخول</button><div id="err" style="color:#f87171"></div></div>
<script src="/app.js"></script>
</body>
</html>
